<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161616" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#080808"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Outer Frame -->
  <rect x="60" y="60" width="1480" height="780" fill="none" stroke="#222222" stroke-width="1.5"/>

  <!-- Top Metadata Bar -->
  <line x1="60" y1="140" x2="1540" y2="140" stroke="#222222" stroke-width="1.5"/>
  <text x="100" y="112" fill="#888888" font-family="monospace, -apple-system, sans-serif" font-size="16" letter-spacing="3">DWS WEB SERVICES // FIELD NOTES &amp; PRICING ARCHITECTURE</text>
  <text x="1400" y="112" fill="#666666" font-family="monospace, -apple-system, sans-serif" font-size="14" letter-spacing="2" text-anchor="end">EST. 2026 · JAIPUR</text>

  <!-- Title Section -->
  <text x="100" y="210" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">WEBSITE COST IN INDIA (2026)</text>
  <text x="100" y="246" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18">Real commercial pricing tiers, technical architecture, and expected business outcomes</text>

  <!-- 3 Pricing Cards -->
  <!-- Card 1 -->
  <g transform="translate(100, 280)">
    <rect width="420" height="460" fill="#0d0d0d" stroke="#262626" stroke-width="1.5"/>
    <rect x="0" y="0" width="420" height="8" fill="#333333"/>
    
    <text x="30" y="45" fill="#888888" font-family="monospace, sans-serif" font-size="13" letter-spacing="2">TIER 01 // TEMPLATE</text>
    <text x="30" y="90" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="32" font-weight="700">₹5k – ₹15k</text>
    <text x="30" y="120" fill="#777777" font-family="-apple-system, sans-serif" font-size="14">Single-payment · 3-7 days turnaround</text>
    
    <line x1="30" y1="150" x2="390" y2="150" stroke="#1f1f1f" stroke-width="1"/>
    
    <text x="30" y="185" fill="#aaaaaa" font-family="-apple-system, sans-serif" font-size="15">Architecture:</text>
    <text x="30" y="210" fill="#e0e0e0" font-family="monospace, sans-serif" font-size="14">Pre-made WP / Elementor builder</text>
    
    <text x="30" y="255" fill="#aaaaaa" font-family="-apple-system, sans-serif" font-size="15">4G Mobile Speed:</text>
    <text x="30" y="280" fill="#ff7777" font-family="monospace, sans-serif" font-size="14">5.0s – 8.0s (Fails Core Web Vitals)</text>
    
    <text x="30" y="325" fill="#aaaaaa" font-family="-apple-system, sans-serif" font-size="15">Code Ownership:</text>
    <text x="30" y="350" fill="#888888" font-family="monospace, sans-serif" font-size="14">Tied to shared host &amp; theme vendor</text>

    <rect x="30" y="390" width="360" height="40" fill="#141414" stroke="#222" stroke-width="1"/>
    <text x="210" y="415" fill="#888888" font-family="monospace, sans-serif" font-size="12" text-anchor="middle" letter-spacing="1">BASIC DIGITAL BROCHURE</text>
  </g>

  <!-- Card 2 (Featured) -->
  <g transform="translate(560, 280)">
    <rect width="440" height="460" fill="#111111" stroke="#444444" stroke-width="2"/>
    <rect x="0" y="0" width="440" height="8" fill="#ffffff"/>
    
    <text x="30" y="45" fill="#e0e0e0" font-family="monospace, sans-serif" font-size="13" letter-spacing="2">TIER 02 // CUSTOM STUDIO</text>
    <text x="30" y="90" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="32" font-weight="700">₹25k – ₹80k</text>
    <text x="30" y="120" fill="#888888" font-family="-apple-system, sans-serif" font-size="14">Fixed scope · 2-4 weeks turnaround</text>
    
    <line x1="30" y1="150" x2="410" y2="150" stroke="#2a2a2a" stroke-width="1"/>
    
    <text x="30" y="185" fill="#aaaaaa" font-family="-apple-system, sans-serif" font-size="15">Architecture:</text>
    <text x="30" y="210" fill="#ffffff" font-family="monospace, sans-serif" font-size="14">Clean React / Static-First CSS</text>
    
    <text x="30" y="255" fill="#aaaaaa" font-family="-apple-system, sans-serif" font-size="15">4G Mobile Speed:</text>
    <text x="30" y="280" fill="#7ee0a5" font-family="monospace, sans-serif" font-size="14">&lt; 1.8s (Passes Core Web Vitals)</text>
    
    <text x="30" y="325" fill="#aaaaaa" font-family="-apple-system, sans-serif" font-size="15">Code Ownership:</text>
    <text x="30" y="350" fill="#ffffff" font-family="monospace, sans-serif" font-size="14">100% Client Git &amp; Domain Admin</text>

    <rect x="30" y="390" width="380" height="40" fill="#ffffff"/>
    <text x="220" y="415" fill="#000000" font-family="monospace, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">RECOMMENDED FOR SERVICE BUSINESSES</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(1040, 280)">
    <rect width="420" height="460" fill="#0d0d0d" stroke="#262626" stroke-width="1.5"/>
    <rect x="0" y="0" width="420" height="8" fill="#333333"/>
    
    <text x="30" y="45" fill="#888888" font-family="monospace, sans-serif" font-size="13" letter-spacing="2">TIER 03 // WEB APPLICATION</text>
    <text x="30" y="90" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="32" font-weight="700">₹1,50,000+</text>
    <text x="30" y="120" fill="#777777" font-family="-apple-system, sans-serif" font-size="14">Full lifecycle · 6-10 weeks delivery</text>
    
    <line x1="30" y1="150" x2="390" y2="150" stroke="#1f1f1f" stroke-width="1"/>
    
    <text x="30" y="185" fill="#aaaaaa" font-family="-apple-system, sans-serif" font-size="15">Architecture:</text>
    <text x="30" y="210" fill="#e0e0e0" font-family="monospace, sans-serif" font-size="14">React + TypeScript + PostgreSQL</text>
    
    <text x="30" y="255" fill="#aaaaaa" font-family="-apple-system, sans-serif" font-size="15">4G Mobile Speed:</text>
    <text x="30" y="280" fill="#7ee0a5" font-family="monospace, sans-serif" font-size="14">Sub-second database latency</text>
    
    <text x="30" y="325" fill="#aaaaaa" font-family="-apple-system, sans-serif" font-size="15">Code Ownership:</text>
    <text x="30" y="350" fill="#888888" font-family="monospace, sans-serif" font-size="14">Enterprise cloud infrastructure</text>

    <rect x="30" y="390" width="360" height="40" fill="#141414" stroke="#222" stroke-width="1"/>
    <text x="210" y="415" fill="#888888" font-family="monospace, sans-serif" font-size="12" text-anchor="middle" letter-spacing="1">CUSTOM ERP / SAAS MVP</text>
  </g>

  <!-- Bottom Details -->
  <text x="100" y="780" fill="#555555" font-family="monospace, sans-serif" font-size="13">AUDITED AGAINST CORE WEB VITALS, DOMAIN REGISTRATION, HOURLY ENGINEERING &amp; CONVERSION INFRASTRUCTURE</text>
</svg>
